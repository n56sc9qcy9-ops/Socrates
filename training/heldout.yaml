# Held-Out Examples
# These examples are kept separate from training examples.
# They are used to evaluate model changes without tuning to the examples being inspected.
# Do NOT add these to training/examples.yaml.
#
# expected_concepts: must reference concept IDs from concepts.yaml
# expected_fields: must reference meaning_frequency_id from frequencies.yaml
# expected_quality: consonant, dissonant, or unresolved_tension

held_out:
  # Example 1: El (Hebrew word for God) - cross-script meaning convergence
  - id: ho.el.1
    input: "El"
    expected_concepts:
      - source
      - light
      - one
    expected_fields:
      - one-unity-whole
    expected_quality: consonant
    confidence: curated
    source: human_review
    notes: "El activates one/unity concepts, converges Hebrew semantics"

  # Example 2: dao (Chinese word for way) - cross-script convergence
  - id: ho.dao.1
    input: "道"
    expected_concepts:
      - path
