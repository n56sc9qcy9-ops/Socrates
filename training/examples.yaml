# Training Examples
# These examples are curated separately from active knowledge.
# They verify the engine; they are NOT automatically added as truth.
# 
# expected_concepts: must reference concept IDs from concepts.yaml
# expected_fields: must reference meaning_frequency_id from frequencies.yaml
# expected_quality: consonant, dissonant, or unresolved_tension

examples:
  # Example 1: spirit concept - activates breath, spirit, and air concepts
  - id: ex.spirit.1
    input: spirit
    expected_concepts:
      - spirit
      - breath
      - air
    expected_fields:
      - breath-vibration
      - spirit-soul-essence
    expected_quality: consonant
    confidence: curated
    source: human_review
    notes: "spirit activates concepts around breath and air, forms coherent harmonic field"

