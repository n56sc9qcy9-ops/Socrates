# Archetype definitions (reference only - IDs used in profiles above)
archetype_definitions:
  - id: pythagorean_triple_1
    name: Monad
    description: 1:1:1 unity triangle

  - id: pythagorean_triple_2
    name: Triangular
    description: 3:4:5 right triangle

  - id: pythagorean_triple_3
    name: Triangular
    description: 4:5:6 triangular

  - id: pythagorean_triple_4
    name: Triangular
    description: 2:3:4 triangular

  - id: pythagorean_triple_5
    name: Primitive
    description: 5:12:13 primitive triple

  - id: pythagorean_triple_6
    name: Primitive
    description: 8:15:17 primitive triple

  - id: phi_approximant_1
    name: Golden Ratio
    description: 1:1.618 or 5:8 approximation

  - id: phi_approximant_2
    name: Extended Golden
    description: 3:5 or 5:8 continuation

  - id: metatron_node_1
    name: Metatron Node
    description: First node in Metatron's Cube sequence

# Harmonic system definitions (reference for ratio validation)
harmonic_systems:
  - name: pythagorean
    description: Pythagorean tuning - pure fifths (3:2 ratio base)
    base_ratio: [3, 2]

  - name: just
    description: Just intonation - pure major thirds (5:4 ratio base)
    base_ratio: [5, 4]

  - name: equal
    description: Equal temperament - 12-tone equal division
    base_ratio: [12, 1]  # semitone