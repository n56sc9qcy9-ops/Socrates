# frequencies.yaml - Integer-based meaning-frequency profiles
# Meaning is frequency. These profiles define the harmonic identity of concepts.
# All values are integers (weight 0-100, ratios as [num, denom], vectors as integers).
# No concept-to-frequency mappings should live in Go code.

# FrequencyProfile is a stable identity that can be shared across language forms.
# For example: "breath" in English, "prana" in Sanskrit, and "ruach" in Hebrew
# may all converge on the same meaning-frequency identity.

frequency_profiles:
