# transmute.yaml - Data-backed counsellor/transmutation relations
# NOT fortune telling — curated relational guidance from knowledge.
# Each relation maps a tension/contracted field (From) to a correction field (To).
# Source describes provenance: curated, traditional, human_review.
# Confidence describes truth level: verified, plausible, speculative.
# Lens describes the interpretive lens for the relation.
# Notes provide context without making fixed-future claims.

transmute_entries:
  # Transmutations where the target is the direct inverse/corollary
  - from: resentment
    to: forgiveness
    kind: transmutes_to
    confidence: plausible
    source: curated
    lens: relational
    weight: 60
    notes: resentment and forgiveness are distinct emotional registers; forgiveness does not deny the reality of the injury but releases its binding charge

  - from: pride
    to: humility
    kind: corrects_through
    confidence: plausible
    source: curated
    lens: relational
    weight: 60
    notes: pride and humility address self-positioning; neither negates the other's existence

  - from: fear
